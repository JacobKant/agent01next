name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pull-requests: write
    
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Получаем всю историю для git diff
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
      - name: Run PR Review
        id: review
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Проверяем наличие API ключа
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "❌ Ошибка: OPENROUTER_API_KEY не установлен"
            echo "Пожалуйста, добавьте секрет OPENROUTER_API_KEY в настройках репозитория:"
            echo "Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          
          # Определяем базовую ветку (обычно main или master)
          BASE_BRANCH="${GITHUB_BASE_REF:-main}"
          HEAD_BRANCH="HEAD"
          
          echo "Base branch: $BASE_BRANCH"
          echo "Head branch: $HEAD_BRANCH"
          echo "PR number: ${{ github.event.pull_request.number }}"
          echo "OPENROUTER_API_KEY установлен: $([ -n "$OPENROUTER_API_KEY" ] && echo 'да' || echo 'нет')"
          
          # Запускаем ревью и сохраняем вывод
          npm run pr-review -- --base "$BASE_BRANCH" --head "$HEAD_BRANCH" 2>&1 | tee review_output.txt || true
          
      - name: Post Review Comment
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const reviewOutput = fs.readFileSync('review_output.txt', 'utf8');
            
            // Извлекаем только ревью (без технических логов)
            // Формат вывода:
            // ========== (80 символов)
            // 📝 РЕЗУЛЬТАТ РЕВЬЮ PR
            // ========== (80 символов)
            // [текст ревью]
            // ========== (80 символов)
            // 📊 Статистика:
            
            let reviewText = '';
            
            // Ищем начало ревью (может быть с эмодзи или без)
            let headerIndex = reviewOutput.indexOf('📝 РЕЗУЛЬТАТ РЕВЬЮ PR');
            if (headerIndex === -1) {
              headerIndex = reviewOutput.indexOf('РЕЗУЛЬТАТ РЕВЬЮ PR');
            }
            
            if (headerIndex !== -1) {
              // Ищем следующий разделитель после заголовка (это начало текста ревью)
              const afterHeader = reviewOutput.substring(headerIndex);
              const dividerAfterHeader = afterHeader.match(/\n={60,}\n/);
              
              if (dividerAfterHeader) {
                const textStartIndex = headerIndex + dividerAfterHeader.index + dividerAfterHeader[0].length;
                
                // Ищем конец ревью - разделитель перед "📊 Статистика:"
                const statsIndex = reviewOutput.indexOf('📊 Статистика:', textStartIndex);
                
                let endIndex = reviewOutput.length;
                if (statsIndex !== -1) {
                  // Ищем последний разделитель из = перед "📊 Статистика:"
                  // Ищем все разделители в диапазоне от textStartIndex до statsIndex
                  const beforeStats = reviewOutput.substring(textStartIndex, statsIndex);
                  const dividerPattern = /\n={60,}\n/g;
                  let lastDividerIndex = -1;
                  let match;
                  
                  while ((match = dividerPattern.exec(beforeStats)) !== null) {
                    lastDividerIndex = match.index;
                  }
                  
                  if (lastDividerIndex !== -1) {
                    endIndex = textStartIndex + lastDividerIndex;
                  } else {
                    // Если не нашли разделитель, берем до "📊 Статистика:"
                    endIndex = statsIndex;
                  }
                }
                
                // Извлекаем текст ревью
                reviewText = reviewOutput.substring(textStartIndex, endIndex).trim();
              }
            }
            
            // Логируем для отладки
            console.log('Длина reviewOutput:', reviewOutput.length);
            console.log('Найден headerIndex:', headerIndex);
            console.log('Длина reviewText:', reviewText.length);
            if (reviewText) {
              console.log('Первые 300 символов reviewText:', reviewText.substring(0, 300));
            } else {
              console.log('⚠️ Ревью текст не найден, показываем весь вывод');
              console.log('Первые 500 символов reviewOutput:', reviewOutput.substring(0, 500));
            }
            
            // Если текст пустой или слишком короткий, используем весь вывод
            if (!reviewText || reviewText.length < 50) {
              console.log('⚠️ Ревью текст слишком короткий, используем весь вывод');
              reviewText = reviewOutput;
            }
            
            const prNumber = context.payload.pull_request?.number || context.issue?.number;
            
            if (!prNumber) {
              console.log('Не удалось определить номер PR');
              return;
            }
            
            // Ищем существующий комментарий от бота
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            
            const botComment = comments.data.find(
              comment => comment.user.type === 'Bot' && comment.body.includes('РЕЗУЛЬТАТ РЕВЬЮ PR')
            );
            
            const commentBody = '## 🤖 Автоматическое ревью PR\n\n' +
              reviewText +
              '\n\n---\n*Этот комментарий был создан автоматически GitHub Actions.*';
            
            if (botComment) {
              // Обновляем существующий комментарий
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody,
              });
            } else {
              // Создаем новый комментарий
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody,
              });
            }
            
      - name: Check Review Result
        if: always()
        run: |
          # Проверяем наличие критичных замечаний
          if grep -q "Критичные\|требуют исправления\|critical" review_output.txt; then
            echo "⚠️ Обнаружены критичные замечания в PR"
            exit 1
          else
            echo "✅ Ревью завершено успешно"
            exit 0
          fi
